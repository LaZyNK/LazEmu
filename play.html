<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>LazEmu – En jeu</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--blue:#3b6cf6;--cyan:#4fd6ff;--green:#8cf04a;--lime:#d7ff4f;--muted:#8a97c7}
html,body{margin:0;height:100%;background:var(--bg);color:#e9f0ff;overflow:hidden}
body{display:flex;flex-direction:column}
.bar{
  display:flex;align-items:center;gap:10px;padding:8px 12px;flex-shrink:0;
  background:linear-gradient(90deg,#0f1736,#16204a);border-bottom:3px solid var(--blue);
  box-shadow:0 0 18px rgba(59,108,246,.45);
}
.bar img{height:34px;filter:drop-shadow(0 0 6px rgba(79,214,255,.6))}
.back{
  font-family:'Press Start 2P',monospace;font-size:10px;color:#06102a;background:var(--green);
  text-decoration:none;padding:9px 10px;border-radius:7px;box-shadow:0 3px 0 #3d8a12;
}
.title{
  flex:1;min-width:0;font-family:'Press Start 2P',monospace;font-size:10px;color:var(--lime);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 8px rgba(215,255,79,.5);
}
#status{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--muted);white-space:nowrap}
#game{flex:1;min-height:0}
@media (orientation:landscape) and (max-height:500px){ .bar{display:none} }
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="index.html">◀ MENU</a>
  <img src="logo.png" alt="LazEmu">
  <span class="title" id="title"></span>
  <button class="back" id="saveBtn" style="border:0;cursor:pointer">💾</button>
  <span id="status"></span>
</div>
<div id="game"></div>
<script type="module">
import { sb, BUCKET, SUPABASE_URL, SUPABASE_KEY } from './config.js';
import { getRom } from './rom-store.js';
const q = new URLSearchParams(location.search);
const file = q.get('file');
document.getElementById('title').textContent = (file || '').replace(/\.[^.]+$/, '');
const status = document.getElementById('status');
const { data: { session } } = await sb.auth.getSession();
if (!session) location.href = 'index.html';
const uid = session.user.id;
let token = session.access_token;
sb.auth.onAuthStateChange((e, s) => { if (s) token = s.access_token; });
const savePath = `${uid}/saves/${file}.sav`;

// ROM prise sur cet appareil ; sinon, ancienne ROM envoyée en ligne
let romUrl = null;
const localRom = await getRom(uid, file).catch(() => null);
if (localRom) romUrl = URL.createObjectURL(localRom);
else {
  const { data: signed } = await sb.storage.from(BUCKET).createSignedUrl(`${uid}/roms/${file}`, 3600);
  if (signed) romUrl = signed.signedUrl;
}
if (!romUrl) { alert('Cette ROM n\'est pas sur cet appareil : ajoute-la depuis le menu.'); location.href = 'index.html'; }

// Envoi de la sauvegarde. "keepalive" (envoi même si on quitte la page) est limité à 64 Ko
// par le navigateur : les grosses sauvegardes (N64, DS, PlayStation) partent en envoi normal.
let lastSent = '';
let sending = false;
function fingerprint(d) { let h = 0; for (let i = 0; i < d.length; i += 7) h = (h * 31 + d[i]) | 0; return d.length + ':' + h; }
function saveNow(force) {
  const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
  if (!gm || sending) return;
  try { gm.saveSaveFiles(); } catch (e) {}
  let data;
  try { data = gm.getSaveFile(); } catch (e) { data = null; }
  if (!data || !data.length) { if (force) status.textContent = 'RIEN À SAUVER'; return; }
  const fp = fingerprint(data);
  if (fp === lastSent && !force) return;          // rien de nouveau depuis le dernier envoi
  sending = true;
  status.textContent = 'SAVE…';
  fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${savePath}`, {
    method: 'POST', keepalive: data.length < 60000, body: data,
    headers: { Authorization: 'Bearer ' + token, apikey: SUPABASE_KEY,
      'x-upsert': 'true', 'Content-Type': 'application/octet-stream' } })
    .then(async r => {
      if (r.ok) { lastSent = fp; status.textContent = 'SAVE ✓ ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
      else { status.textContent = 'SAVE ✕ ' + r.status; console.warn(await r.text()); }
    })
    .catch(e => { status.textContent = 'SAVE ✕'; console.warn(e); })
    .finally(() => { sending = false; });
}

window.EJS_player = '#game';
window.EJS_core = q.get('core');
window.EJS_gameName = file;
window.EJS_gameUrl = romUrl;
window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
window.EJS_startOnLoaded = true;
window.EJS_color = '#3b6cf6';
window.EJS_backgroundColor = '#070b1f';
window.EJS_onGameStart = async () => {
  const { data: blob } = await sb.storage.from(BUCKET).download(savePath);
  if (blob) {
    const gm = window.EJS_emulator.gameManager;
    const p = gm.getSaveFilePath();
    const parts = p.split('/'); let cur = '';
    for (let i = 0; i < parts.length - 1; i++) { cur += parts[i] + '/'; if (!gm.FS.analyzePath(cur).exists) gm.FS.mkdir(cur); }
    gm.FS.writeFile(p, new Uint8Array(await blob.arrayBuffer()));
    gm.loadSaveFiles();
    gm.restart();
    status.textContent = 'SAVE CHARGÉE';
  }
  setInterval(() => saveNow(false), 15000);
};
window.addEventListener('pagehide', () => saveNow(false));
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(false); });
document.getElementById('saveBtn').onclick = () => saveNow(true);
// Le bouton MENU envoie la sauvegarde avant de quitter
document.querySelector('.back').addEventListener('click', e => {
  e.preventDefault(); saveNow(true);
  const go = () => { if (!sending) location.href = 'index.html'; else setTimeout(go, 200); };
  setTimeout(go, 300);
});
const s = document.createElement('script');
s.src = window.EJS_pathtodata + 'loader.js';
document.body.appendChild(s);
</script>
</body>
</html>
